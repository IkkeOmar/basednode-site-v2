<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cfc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bgGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Dark rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0b0d17"/>

  <!-- Ambient glow behind orb -->
  <circle cx="32" cy="32" r="22" fill="#7c5cfc" opacity="0.25" filter="url(#bgGlow)"/>

  <!-- Main glowing orb -->
  <circle cx="32" cy="32" r="14" fill="url(#g)" filter="url(#glow)"/>

  <!-- Inner highlight -->
  <ellipse cx="28" cy="28" rx="5" ry="4" fill="rgba(255,255,255,0.35)"/>

  <!-- Tiny orbiting particle (inspired by home page particles) -->
  <circle cx="44" cy="20" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="20" cy="44" r="1.5" fill="#7c5cfc" opacity="0.5"/>
</svg>
