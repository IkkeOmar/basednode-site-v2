<style>
/* ===== CONCEPT 1: THE AGENCY ===== */
/* Slate/purple · Glassmorphism · Spring transitions */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

*, *::before, *::after { transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); transition-duration: 350ms; box-sizing: border-box; }
html { scroll-behavior: smooth; }

:root, [data-theme="dark"] {
  --bg-primary: #0f1117;
  --bg-secondary: #181b24;
  --bg-tertiary: #1e2230;
  --bg-card: rgba(24, 27, 36, 0.6);
  --bg-glass: rgba(15, 17, 23, 0.72);
  --bg-glass-hover: rgba(24, 27, 36, 0.85);
  --border-subtle: rgba(255, 255, 255, 0.06);
  --border-hover: rgba(255, 255, 255, 0.12);
  --text-primary: #f1f3f5;
  --text-secondary: #8b95a5;
  --text-tertiary: #5c6675;
  --accent: #a78bfa;
  --accent-hover: #c4b5fd;
  --accent-dim: rgba(167, 139, 250, 0.15);
  --accent-glow: rgba(167, 139, 250, 0.25);
  --success: #34d399;
  --warning: #fbbf24;
  --error: #f87171;
  --input-bg: rgba(255,255,255,0.04);
  --input-border: rgba(255,255,255,0.08);
  --badge-bg: rgba(167,139,250,0.1);
  --pill-bg: rgba(255,255,255,0.03);
}

[data-theme="light"] {
  --bg-primary: #f8f5f0;
  --bg-secondary: #eeebe6;
  --bg-tertiary: #e5e0d8;
  --bg-card: rgba(255, 255, 255, 0.7);
  --bg-glass: rgba(248, 245, 240, 0.85);
  --bg-glass-hover: rgba(255, 255, 255, 0.95);
  --border-subtle: rgba(0, 0, 0, 0.06);
  --border-hover: rgba(0, 0, 0, 0.12);
  --text-primary: #1a1a1a;
  --text-secondary: #555555;
  --text-tertiary: #888888;
  --accent: #7c3aed;
  --accent-hover: #6d28d9;
  --accent-dim: rgba(124, 58, 237, 0.1);
  --accent-glow: rgba(124, 58, 237, 0.15);
  --success: #059669;
  --warning: #d97706;
  --error: #dc2626;
  --input-bg: rgba(0,0,0,0.02);
  --input-border: rgba(0,0,0,0.1);
  --badge-bg: rgba(124,58,237,0.08);
  --pill-bg: rgba(0,0,0,0.02);
}

body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body { transition: background 300ms ease, color 300ms ease; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border-width: 0; }

/* ===== NAV ===== */
.nav { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100; background: var(--bg-glass); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); border-bottom: 1px solid var(--border-subtle); }
.nav.scrolled { box-shadow: 0 1px 20px rgba(0,0,0,0.3); border-bottom-color: rgba(167, 139, 250, 0.15); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.nav-logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.nav-logo:hover { opacity: 0.8; }
.nav-logo .logo-accent { color: var(--accent); }
.nav-links { display: flex; align-items: center; gap: 4px; list-style: none; margin: 0; padding: 0; }
.nav-link { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; padding: 6px 14px; border-radius: 6px; }
.nav-link:hover { color: var(--text-primary); background: var(--accent-dim); }
.nav-cta { font-size: 0.8rem; font-weight: 600; color: #fff; background: var(--accent); text-decoration: none; padding: 8px 18px; border-radius: 6px; }
.nav-cta:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
.nav-toggle-btn { background: none; border: 1px solid var(--border-subtle); color: var(--text-secondary); cursor: pointer; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; line-height: 1; }
.nav-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-toggles { display: flex; align-items: center; gap: 6px; }

/* ===== MOBILE NAV ===== */
.mobile-menu-btn { display: none; background: none; border: 1px solid var(--border-subtle); color: var(--text-primary); cursor: pointer; padding: 8px; border-radius: 6px; }
.mobile-nav-overlay { display: none; position: fixed; inset: 0; z-index: 99; background: var(--bg-primary); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); height: 100dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: calc(56px + 16px); padding-bottom: 24px; opacity: 0; visibility: hidden; }
.mobile-nav-overlay.open { opacity: 1; visibility: visible; }
.mobile-nav-links { list-style: none; margin: 0; padding: 0 24px; display: flex; flex-direction: column; gap: 2px; }
.mobile-nav-link { display: block; font-size: 1.05rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; padding: 14px 16px; border-radius: 10px; }
.mobile-nav-link:hover { color: var(--text-primary); background: var(--accent-dim); }
.mobile-nav-cta { display: block; text-align: center; font-size: 1rem; font-weight: 600; color: #fff; background: var(--accent); text-decoration: none; padding: 14px 24px; margin: 12px 24px 0; border-radius: 10px; }
.mobile-nav-toggles { display: flex; gap: 10px; justify-content: center; margin: 16px 24px; }

/* ===== SECTIONS ===== */
.section { padding: 100px 0; }
.section-header { text-align: center; margin-bottom: 64px; }
.section-label { display: inline-block; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 12px; }
.section-title { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; margin: 0 0 16px; color: var(--text-primary); }
.section-subtitle { font-size: 1.05rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto; line-height: 1.6; }

/* ===== HERO ===== */
.hero { min-height: 100dvh; display: flex; align-items: center; justify-content: center; position: relative; padding: 120px 0 80px; overflow: hidden; }
.hero::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at 30% 40%, rgba(167, 139, 250, 0.08) 0%, transparent 60%), radial-gradient(ellipse at 70% 60%, rgba(167, 139, 250, 0.04) 0%, transparent 50%); pointer-events: none; z-index: 0; }
.hero-content { position: relative; z-index: 1; text-align: center; max-width: 800px; margin: 0 auto; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 500; color: var(--accent); background: var(--accent-dim); padding: 6px 16px; border-radius: 100px; border: 1px solid rgba(167, 139, 250, 0.2); margin-bottom: 32px; }
.hero-title { font-size: 4rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; margin: 0 0 24px; color: var(--text-primary); }
.hero-title .accent-text { color: var(--accent); position: relative; }
.hero-title .accent-text::after { content: ''; position: absolute; bottom: 2px; left: 0; right: 0; height: 4px; background: var(--accent); border-radius: 2px; opacity: 0.4; }
.hero-subtitle { font-size: 1.15rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto 40px; line-height: 1.7; }
.hero-actions { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }

/* ===== BUTTONS ===== */
.btn-primary, .btn-secondary { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; padding: 14px 28px; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; }
.btn-primary { color: #fff; background: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 8px 32px var(--accent-glow); }
.btn-secondary { color: var(--text-primary); background: transparent; border: 1px solid var(--border-subtle); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); background: var(--accent-dim); }

/* ===== PILLARS ===== */
.pillars-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.pillar-card { background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 40px 32px; text-align: center; }
.pillar-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 12px 48px rgba(167, 139, 250, 0.1); background: var(--bg-glass-hover); }
.pillar-icon { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: var(--accent-dim); border-radius: 10px; margin: 0 auto 20px; color: var(--accent); }
.pillar-card:hover .pillar-icon { background: var(--accent); color: #fff; transform: scale(1.05); }
.pillar-title { font-size: 1.2rem; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.02em; }
.pillar-desc { font-size: 0.9rem; color: var(--text-secondary); margin: 0; line-height: 1.6; }

/* ===== SERVICES GRID ===== */
.software-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.software-card { background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 32px 28px; position: relative; }
.software-card:hover { border-color: var(--accent); transform: translateY(-4px) scale(1.01); box-shadow: 0 12px 48px rgba(167, 139, 250, 0.08); }
.software-card-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--accent-dim); border-radius: 10px; margin-bottom: 18px; color: var(--accent); }
.software-card:hover .software-card-icon { background: var(--accent); color: #fff; }
.software-card-title { font-size: 1.05rem; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.02em; }
.software-card-desc { font-size: 0.85rem; color: var(--text-secondary); margin: 0 0 8px; line-height: 1.6; }
.software-card-tag { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); background: var(--accent-dim); display: inline-block; padding: 3px 10px; border-radius: 100px; margin-top: 10px; }
.software-card-link { font-size: 0.8rem; font-weight: 600; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.software-card-link:hover { gap: 10px; }

/* ===== CASES ===== */
.cases-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.case-card { background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 32px 28px; position: relative; overflow: hidden; }
.case-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 12px 48px rgba(167, 139, 250, 0.08); }
.case-card-tag { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); background: var(--accent-dim); display: inline-block; padding: 4px 10px; border-radius: 100px; margin-bottom: 16px; }
.case-card-title { font-size: 1.05rem; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.02em; }
.case-card-desc { font-size: 0.85rem; color: var(--text-secondary); margin: 0; line-height: 1.6; }
.case-card-metrics { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.case-card-metric { font-size: 0.75rem; font-weight: 600; color: var(--success); background: var(--pill-bg); padding: 4px 12px; border-radius: 100px; border: 1px solid var(--border-subtle); }

/* ===== ABOUT ===== */
.about-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
.about-content .section-label, .about-content .section-title, .about-content .section-subtitle { text-align: left; }
.about-content .section-subtitle { margin: 0 0 24px; max-width: 100%; }
.about-text { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.7; margin: 0 0 24px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.badge { font-size: 0.7rem; font-weight: 500; color: var(--accent); background: var(--badge-bg); border: 1px solid rgba(167,139,250,0.15); padding: 5px 12px; border-radius: 100px; }
.badge:hover { border-color: var(--accent); }
.about-details { display: flex; flex-direction: column; gap: 12px; }
.about-detail-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-secondary); }
.about-visual { display: flex; align-items: center; justify-content: center; }
.about-card { background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 48px 40px; width: 100%; max-width: 420px; text-align: center; }
.about-card-name { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
.about-card-role { font-size: 0.85rem; color: var(--accent); margin: 0 0 20px; font-weight: 500; }
.about-card-stats { display: flex; flex-direction: column; gap: 10px; text-align: left; }
.about-stat { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--pill-bg); border: 1px solid var(--border-subtle); font-size: 0.8rem; }
.about-stat-label { color: var(--text-tertiary); }
.about-stat-value { color: var(--text-primary); font-weight: 500; font-family: monospace; }

/* ===== CONTACT FORM ===== */
.form-wrapper { max-width: 560px; margin: 0 auto; background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 48px 40px; }
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.form-input, .form-select, .form-textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; padding: 12px 16px; font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--text-primary); outline: none; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.form-textarea { min-height: 120px; resize: vertical; }
.form-submit { width: 100%; margin-top: 8px; }

/* ===== FOOTER ===== */
.footer { border-top: 1px solid var(--border-subtle); padding: 80px 0 40px; margin-top: 40px; }
.footer-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 48px; margin-bottom: 60px; }
.footer-brand { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 16px; }
.footer-brand .logo-accent { color: var(--accent); }
.footer-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; margin: 0 0 20px; max-width: 300px; }
.footer-social { display: flex; gap: 12px; }
.footer-social-link { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 6px; background: var(--bg-tertiary); color: var(--text-secondary); text-decoration: none; border: 1px solid var(--border-subtle); }
.footer-social-link:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); transform: translateY(-2px); }
.footer-heading { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); margin: 0 0 20px; }
.footer-links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.footer-link { font-size: 0.85rem; color: var(--text-secondary); text-decoration: none; display: inline-block; }
.footer-link:hover { color: var(--accent); transform: translateX(3px); }
.footer-bottom { display: flex; align-items: center; justify-content: space-between; padding-top: 32px; border-top: 1px solid var(--border-subtle); font-size: 0.8rem; color: var(--text-tertiary); }
.footer-cvr { font-family: 'Courier New', monospace; font-size: 0.75rem; }

/* ===== SCROLL REVEAL ===== */
.reveal { opacity: 0; transform: translateY(30px); transition: opacity 600ms cubic-bezier(0.34, 1.56, 0.64, 1), transform 600ms cubic-bezier(0.34, 1.56, 0.64, 1); }
.reveal.visible { opacity: 1; transform: translateY(0); }
::selection { background: var(--accent-dim); color: var(--text-primary); }

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) { .pillars-grid, .software-grid { grid-template-columns: repeat(2, 1fr); } .cases-grid { grid-template-columns: repeat(2, 1fr); } .footer-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 768px) {
  .nav-links { display: none; } .mobile-menu-btn { display: flex; align-items: center; justify-content: center; } .mobile-nav-overlay { display: block; }
  .hero-title { font-size: 2.5rem; } .hero-subtitle { font-size: 1rem; } .section-title { font-size: 1.8rem; }
  .pillars-grid, .software-grid, .cases-grid { grid-template-columns: 1fr; }
  .about-layout { grid-template-columns: 1fr; gap: 40px; }
  .footer-grid { grid-template-columns: 1fr; gap: 32px; }
  .footer-bottom { flex-direction: column; gap: 8px; text-align: center; }
  .section { padding: 60px 0; }
  .form-wrapper { padding: 32px 24px; }
}
@media (max-width: 480px) { .hero-title { font-size: 2rem; } .container { padding: 0 16px; } .hero-actions { flex-direction: column; width: 100%; } .btn-primary, .btn-secondary { width: 100%; justify-content: center; } }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }

/* ===== PAGE LOAD ANIMATIONS ===== */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px var(--accent-glow); } 50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(167, 139, 250, 0.15); } }

.hero-content { animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
.hero .hero-badge { animation: fadeIn 0.6s ease 0.2s both; }
.hero .hero-title { animation: slideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both; }
.hero .hero-subtitle { animation: fadeInUp 0.7s ease 0.5s both; }
.hero .hero-actions { animation: fadeInUp 0.7s ease 0.7s both; }

/* ===== HERO GRADIENT MESH ===== */
.hero-gradient-mesh { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.hero-gradient-mesh .mesh-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: floatBlob 20s ease-in-out infinite; }
.hero-gradient-mesh .mesh-blob:nth-child(1) { width: 600px; height: 600px; background: radial-gradient(circle, rgba(167, 139, 250, 0.15), transparent); top: -10%; left: -10%; animation-delay: 0s; }
.hero-gradient-mesh .mesh-blob:nth-child(2) { width: 500px; height: 500px; background: radial-gradient(circle, rgba(139, 92, 246, 0.1), transparent); bottom: -10%; right: -5%; animation-delay: -5s; }
.hero-gradient-mesh .mesh-blob:nth-child(3) { width: 400px; height: 400px; background: radial-gradient(circle, rgba(167, 139, 250, 0.08), transparent); top: 40%; left: 50%; animation-delay: -10s; }
@keyframes floatBlob { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(30px, -40px) scale(1.1); } 50% { transform: translate(-20px, 20px) scale(0.95); } 75% { transform: translate(40px, 30px) scale(1.05); } }

/* ===== PRICING CARDS ===== */
.pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
.pricing-card { background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 40px 32px; text-align: center; position: relative; display: flex; flex-direction: column; }
.pricing-card:hover { border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 20px 60px rgba(167, 139, 250, 0.12); }
.pricing-card.featured { border-color: var(--accent); background: linear-gradient(135deg, rgba(167, 139, 250, 0.08), rgba(139, 92, 246, 0.04)); border-width: 2px; position: relative; }
.pricing-card.featured::before { content: 'Most Popular'; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #fff; background: var(--accent); padding: 4px 16px; border-radius: 100px; }
.pricing-card-name { font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 8px; }
.pricing-card-price { font-size: 3rem; font-weight: 800; letter-spacing: -0.04em; color: var(--text-primary); margin-bottom: 4px; line-height: 1.1; }
.pricing-card-price span { font-size: 1rem; font-weight: 500; color: var(--text-tertiary); }
.pricing-card-desc { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 24px; }
.pricing-card-features { list-style: none; margin: 0 0 28px; padding: 0; text-align: left; flex: 1; }
.pricing-card-features li { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text-secondary); padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
.pricing-card-features li:last-child { border-bottom: none; }
.pricing-card-features li .feat-icon { color: var(--success); flex-shrink: 0; }
.pricing-card-features li .feat-icon.muted { color: var(--text-tertiary); }
.pricing-card .btn-primary, .pricing-card .btn-secondary { width: 100%; justify-content: center; }

/* ===== 3D TILT CARDS ===== */
.tilt-card { transition: transform 0.2s cubic-bezier(0.2, 0, 0.3, 1); transform-style: preserve-3d; will-change: transform; }
.tilt-card:hover { transform: perspective(800px) rotateX(var(--tilt-y, 0deg)) rotateY(var(--tilt-x, 0deg)) scale3d(1.02, 1.02, 1.02); }
.tilt-card .tilt-content { transform: translateZ(20px); }
.tilt-card .tilt-glow { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(circle at var(--glow-x, 50%) var(--glow-y, 50%), rgba(167, 139, 250, 0.06), transparent 60%); opacity: 0; transition: opacity 0.3s; }
.tilt-card:hover .tilt-glow { opacity: 1; }

/* ===== STAGGERED SCROLL REVEAL ===== */
.stagger-reveal { opacity: 0; transform: translateY(40px); }
.stagger-reveal.visible { animation: staggerFadeIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
.stagger-reveal:nth-child(1).visible { animation-delay: 0s; }
.stagger-reveal:nth-child(2).visible { animation-delay: 0.1s; }
.stagger-reveal:nth-child(3).visible { animation-delay: 0.2s; }
.stagger-reveal:nth-child(4).visible { animation-delay: 0.3s; }
.stagger-reveal:nth-child(5).visible { animation-delay: 0.4s; }
.stagger-reveal:nth-child(6).visible { animation-delay: 0.5s; }
.stagger-reveal:nth-child(7).visible { animation-delay: 0.6s; }
@keyframes staggerFadeIn { to { opacity: 1; transform: translateY(0); } }

/* ===== PROCESS SECTION ===== */
.process-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 40px; position: relative; }
.process-step { text-align: center; position: relative; }
.process-step::after { content: ''; position: absolute; top: 28px; left: 60%; width: 80%; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); opacity: 0.3; }
.process-step:last-child::after { display: none; }
.process-step-num { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; background: var(--accent-dim); border: 1px solid rgba(167, 139, 250, 0.2); border-radius: 50%; font-size: 1.2rem; font-weight: 700; color: var(--accent); transition: all 0.3s; }
.process-step:hover .process-step-num { background: var(--accent); color: #fff; transform: scale(1.1); box-shadow: 0 0 30px var(--accent-glow); }
.process-step-title { font-size: 1rem; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
.process-step-desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.6; margin: 0; }

/* ===== FAQ ACCORDION ===== */
.faq-list { max-width: 720px; margin: 40px auto 0; }
.faq-item { background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.faq-item:hover { border-color: var(--border-hover); }
.faq-item.active { border-color: var(--accent); }
.faq-question { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; cursor: pointer; font-size: 0.95rem; font-weight: 600; color: var(--text-primary); background: none; border: none; width: 100%; text-align: left; font-family: 'Inter', sans-serif; gap: 16px; }
.faq-question:hover { color: var(--accent); }
.faq-icon { flex-shrink: 0; width: 20px; height: 20px; transition: transform 0.3s; color: var(--text-tertiary); }
.faq-item.active .faq-icon { transform: rotate(180deg); color: var(--accent); }
.faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), padding 0.3s; padding: 0 24px; }
.faq-item.active .faq-answer { max-height: 300px; padding: 0 24px 20px; }
.faq-answer p { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.7; margin: 0; }

/* ===== RESPONSIVE NEW SECTIONS ===== */
@media (max-width: 1024px) { .pricing-grid { grid-template-columns: repeat(2, 1fr); } .process-grid { grid-template-columns: repeat(2, 1fr); } .process-step::after { display: none; } }
@media (max-width: 768px) { .pricing-grid { grid-template-columns: 1fr; } .process-grid { grid-template-columns: repeat(2, 1fr); gap: 32px; } .pricing-card { padding: 28px 20px; } }
@media (max-width: 480px) { .process-grid { grid-template-columns: 1fr; } }
}

// ===== LANGUAGE STATE =====
let currentLang = localStorage.getItem('bn-lang') || 'en';
function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('bn-lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (TEXT[lang] && TEXT[lang][key]) {
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = TEXT[lang][key];
      else el.textContent = TEXT[lang][key];
    }
  });
  document.querySelectorAll('#formType option').forEach((opt, i) => {
    const keys = ['opt_fixed', 'opt_revenue', 'opt_partnership'];
    if (TEXT[lang] && TEXT[lang][keys[i]]) opt.textContent = TEXT[lang][keys[i]];
  });
  document.getElementById('langToggle').textContent = lang === 'da' ? 'DA | EN' : 'DA | EN';
  document.getElementById('mobileLangToggle').textContent = lang === 'da' ? 'DA | EN' : 'DA | EN';
}

// ===== THEME STATE =====
let currentTheme = localStorage.getItem('bn-theme') || 'dark';
function setTheme(theme) {
  currentTheme = theme;
  localStorage.setItem('bn-theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
  const icon = theme === 'dark' ? '🌙' : '☀️';
  document.getElementById('themeToggle').textContent = icon;
  document.getElementById('mobileThemeToggle').textContent = icon;
}

// ===== INIT =====
(function init() {
  // Theme
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const savedTheme = localStorage.getItem('bn-theme');
  if (savedTheme) currentTheme = savedTheme;
  else currentTheme = prefersDark ? 'dark' : 'light';
  setTheme(currentTheme);

  // Language
  const savedLang = localStorage.getItem('bn-lang');
  if (savedLang) currentLang = savedLang;
  setLanguage(currentLang);

  // Toggle buttons
  document.getElementById('themeToggle').addEventListener('click', () => setTheme(currentTheme === 'dark' ? 'light' : 'dark'));
  document.getElementById('mobileThemeToggle').addEventListener('click', () => setTheme(currentTheme === 'dark' ? 'light' : 'dark'));
  document.getElementById('langToggle').addEventListener('click', () => setLanguage(currentLang === 'da' ? 'en' : 'da'));
  document.getElementById('mobileLangToggle').addEventListener('click', () => setLanguage(currentLang === 'da' ? 'en' : 'da'));
})();

// ===== MOBILE NAV =====
var mobileOpen = false, mobileOverlay = document.getElementById('mobileOverlay'), menuBtn = document.getElementById('menuBtn');
function toggleMobile() {
  mobileOpen = !mobileOpen;
  mobileOverlay.classList.toggle('open', mobileOpen);
  document.body.style.overflow = mobileOpen ? 'hidden' : '';
  menuBtn.innerHTML = mobileOpen
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';
}
function closeMobile() { if (mobileOpen) toggleMobile(); }

// ===== NAV SCROLL =====
var navbar = document.getElementById('navbar');
window.addEventListener('scroll', function() { navbar.classList.toggle('scrolled', window.scrollY > 20); }, { passive: true });

// ===== ROTATING WORDS =====
var words = ['Automation', 'AI Agents', 'Data', 'Machine Learning'];
var wordIndex = 0, wordEl = document.getElementById('rotatingWord');
function rotateWord() {
  wordIndex = (wordIndex + 1) % words.length;
  wordEl.style.opacity = '0';
  wordEl.style.transform = 'translateY(-10px)';
  setTimeout(function() { wordEl.textContent = words[wordIndex]; wordEl.style.opacity = '1'; wordEl.style.transform = 'translateY(0)'; }, 200);
}
if (wordEl) setInterval(rotateWord, 3000);

// ===== INTERSECTION OBSERVER =====
if (window.IntersectionObserver) {
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });
} else { document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('visible'); }); }

// ===== FAQ ACCORDION =====
function toggleFaq(btn) {
  var item = btn.closest('.faq-item');
  if (!item) return;
  var isActive = item.classList.contains('active');
  // Close all
  document.querySelectorAll('.faq-item.active').forEach(function(el) { el.classList.remove('active'); });
  if (!isActive) item.classList.add('active');
}

// ===== 3D TILT EFFECT =====
(function() {
  var cards = document.querySelectorAll('.tilt-card');
  cards.forEach(function(card) {
    card.addEventListener('mousemove', function(e) {
      var rect = card.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var centerX = rect.width / 2;
      var centerY = rect.height / 2;
      var rotateX = ((y - centerY) / centerY) * -8;
      var rotateY = ((x - centerX) / centerX) * 8;
      card.style.setProperty('--tilt-x', rotateY + 'deg');
      card.style.setProperty('--tilt-y', rotateX + 'deg');
      card.style.setProperty('--glow-x', (x / rect.width) * 100 + '%');
      card.style.setProperty('--glow-y', (y / rect.height) * 100 + '%');
    });
    card.addEventListener('mouseleave', function() {
      card.style.setProperty('--tilt-x', '0deg');
      card.style.setProperty('--tilt-y', '0deg');
    });
  });
})();

// ===== STAGGERED SCROLL REVEAL =====
(function() {
  var els = document.querySelectorAll('.stagger-reveal');
  if (!els.length) return;
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
  els.forEach(function(el) { observer.observe(el); });
})();
</script>
